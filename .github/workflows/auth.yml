name: Go E2E BDD tests

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.23.1'

      - name: Run E2E tests
        env:
          USER_EMAIL: ${{ secrets.RECIPIENT_EMAIL_ADDRESS}}
          USER_PASSWORD: ${{ secrets.RECIPIENT_PASSWORD }}
          USER_SECRET: "123456"
        run: make run-e2e

      - name: Remove env
        run: make docker-rm